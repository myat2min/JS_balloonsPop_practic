<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <title>Background Changer</title>
</head>

<body>
    <div class="card">
        <div class="card-body">
            <div style="text-align: center;">
                <h1>Background Changer</h1>
                <button type="button" class="btn btn-primary" id="Primary">Primary</button>
                <button type="button" class="btn btn-success" id="Success">Success</button>
                <button type="button" class="btn btn-info" id="Info">Info</button>
                <button type="button" class="btn btn-warning" id="Warning">Warning</button>
            </div>
        </div>
    </div>

    <script>
        var buttons = document.querySelectorAll('.btn');
        var body = document.querySelector('body');

        buttons.forEach(function (button) {
            button.addEventListener('click', function (e) {
                console.log(e.target.id);
                if (e.target.id == 'Primary') {
                    body.style.backgroundColor = '#007bff';
                } else if (e.target.id == 'Success') {
                    body.style.backgroundColor = '#198754';
                } else if (e.target.id == 'Info') {
                    body.style.backgroundColor = '#0dcaf0';
                } else if (e.target.id == 'Warning') {
                    body.style.backgroundColor = '#ffc107';
                }
            });
        });
    </script>
</body>

</html>
